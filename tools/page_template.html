<title>خريطة الأمر والنهي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Spectral:ital,wght@0,300;0,400;0,600;1,300&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --sky:#0A0E1C; --sky2:#111830; --line:#232C4A; --line2:#33407A;
    --ink:#EDE6D6; --ink2:#A9B0C8; --mute:#6B7391;
    --gold:#F2C56B; --gold2:#FFE7B0; --ember:#E4553D; --ember2:#FF9C8A;
    --panel:#0F1528; --ff-ar:"Amiri","Scheherazade New","Noto Naskh Arabic",serif;
    --ff-body:"Spectral",Georgia,serif; --ff-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  html,body{height:100%}
  body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--ff-body);font-size:15px;line-height:1.5;overflow:hidden}
  *{box-sizing:border-box}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  #app{display:grid;grid-template-rows:auto 1fr;height:100%}
  header{display:flex;align-items:center;gap:18px;padding:12px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0E1428,var(--sky));flex-wrap:wrap}
  .title{display:flex;flex-direction:column;line-height:1.1}
  .title .ar{font-family:var(--ff-ar);font-size:26px;font-weight:700;color:var(--gold2);direction:rtl}
  .title .en{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-top:4px}
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-inline-start:auto}
  .seg{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
  .seg button{padding:6px 14px;font-size:13px;color:var(--ink2)}
  .seg button[aria-pressed="true"]{background:var(--sky2);color:var(--ink)}
  .seg button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:1px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--ink2);font-family:var(--ff-ar);font-size:15px;line-height:1.2}
  .chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold2)}
  .chip.off{opacity:.45}
  input[type=search]{background:var(--sky2);border:1px solid var(--line2);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;width:180px}
  input[type=search]::placeholder{color:var(--mute)}
  main{position:relative;overflow:hidden}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas.dragging{cursor:grabbing}
  .legend{position:absolute;left:16px;bottom:14px;font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .legend .row{display:flex;align-items:center;gap:8px}
  .legend .st{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor}
  .legend .sizes{display:flex;align-items:center;gap:6px}
  .legend .sz{border-radius:50%;background:var(--ink2);opacity:.7}
  .hint{position:absolute;right:16px;bottom:14px;font-size:12px;color:var(--mute);pointer-events:none;text-align:right}
  .tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line2);padding:8px 12px;border-radius:6px;font-size:13px;transform:translate(-50%,-130%);white-space:nowrap;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .tip .ar{font-family:var(--ff-ar);font-size:19px;direction:rtl;display:block;color:var(--gold2)}
  .tip.h .ar{color:var(--ember2)}
  .tip .n{color:var(--ink2);font-family:var(--ff-mono);font-size:11px}
  /* panel */
  aside{position:absolute;top:0;right:0;height:100%;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .28s ease;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
  aside.open{transform:none}
  @media (prefers-reduced-motion:reduce){aside{transition:none}}
  .ph{padding:18px 22px 14px;border-bottom:1px solid var(--line);position:relative}
  .ph .close{position:absolute;top:12px;left:14px;font-size:22px;color:var(--ink2);line-height:1;padding:4px 8px}
  .ph .ar{font-family:var(--ff-ar);font-size:34px;line-height:1.15;direction:rtl;text-align:right;color:var(--gold2);text-wrap:balance}
  .ph.h .ar{color:var(--ember2)}
  .ph .en{color:var(--ink2);font-size:14px;text-align:right;margin-top:2px}
  .ph .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-family:var(--ff-mono);font-size:11.5px;color:var(--ink2);justify-content:flex-end}
  .ph .meta b{color:var(--ink);font-weight:500}
  .ph .lem{direction:rtl;text-align:right;font-family:var(--ff-ar);font-size:16px;color:var(--mute);margin-top:6px}
  .ph .lem span{margin-inline-start:8px}
  .ph .note{margin-top:8px;font-size:13px;color:var(--ink2);font-style:italic;line-height:1.4}
  .ph .opp{margin-top:8px;font-size:13px;color:var(--ink2)}
  .ph .opp button{font-family:var(--ff-ar);font-size:17px;color:var(--gold2);text-decoration:underline dotted;text-underline-offset:3px}
  .ph .opp button.h{color:var(--ember2)}
  .verses{overflow:auto;padding:6px 22px 30px;flex:1}
  .v{padding:16px 0;border-bottom:1px solid var(--line)}
  .v.key{background:linear-gradient(90deg,transparent,rgba(242,197,107,.06));margin:0 -22px;padding-inline:22px;border-inline-start:2px solid var(--gold)}
  .v .ref{font-family:var(--ff-mono);font-size:11px;color:var(--mute);display:flex;justify-content:space-between}
  .v .ref .k{color:var(--gold)}
  .v .ar{font-family:var(--ff-ar);font-size:22px;line-height:1.85;direction:rtl;text-align:right;margin:6px 0 4px}
  .v .en{font-size:14px;color:var(--ink2);line-height:1.55}
  .v mark{background:none;color:var(--gold2);font-weight:700}
  .h .v mark{color:var(--ember2)}
  /* table view */
  #table{position:absolute;inset:0;background:var(--sky);overflow:auto;display:none;padding:20px 24px}
  #table.on{display:block}
  table{border-collapse:collapse;width:100%;max-width:1100px;margin:0 auto;font-size:14px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:600;position:sticky;top:0;background:var(--sky);cursor:pointer}
  th.on{color:var(--gold2)}
  td.ar{font-family:var(--ff-ar);font-size:20px;direction:rtl;text-align:right;white-space:nowrap}
  td.n{font-family:var(--ff-mono);font-variant-numeric:tabular-nums;text-align:right}
  td .bar{height:6px;border-radius:3px;margin-top:6px;opacity:.85}
  tr{cursor:pointer}
  tr:hover td{background:var(--sky2)}
  .pol{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:1px}
  .about{max-width:1100px;margin:0 auto 18px;color:var(--ink2);font-size:14px;line-height:1.55}
  .about b{color:var(--ink)}
  @media (max-width:720px){
    header{gap:10px;padding:10px 12px}
    .title .ar{font-size:22px}
    input[type=search]{width:130px}
    .legend,.hint{display:none}
    aside{width:100%;height:70%;top:auto;bottom:0;border-left:0;border-top:1px solid var(--line);transform:translateY(102%)}
  }
</style>

<div id="app">
  <header>
    <div class="title"><span class="ar">خريطة الأمر والنهي</span><span class="en">What the Quran commands · what it forbids</span></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Show">
        <button id="fAll" aria-pressed="true">All</button>
        <button id="fV" aria-pressed="false"><span class="dot" style="background:var(--gold)"></span>Virtues</button>
        <button id="fH" aria-pressed="false"><span class="dot" style="background:var(--ember)"></span>Haram</button>
      </div>
      <div class="chips" id="chips"></div>
      <input type="search" id="q" placeholder="search  ·  بحث" aria-label="Search concepts">
      <div class="seg" role="group" aria-label="View">
        <button id="vMap" aria-pressed="true">Map</button>
        <button id="vTable" aria-pressed="false">Table</button>
      </div>
    </div>
  </header>
  <main>
    <canvas id="c"></canvas>
    <div class="tip" id="tip"></div>
    <div class="legend">
      <div class="row"><span class="st" style="color:var(--gold);background:var(--gold)"></span>commanded / praised</div>
      <div class="row"><span class="st" style="color:var(--ember);background:var(--ember)"></span>forbidden / condemned</div>
      <div class="row sizes"><span class="sz" style="width:5px;height:5px"></span><span class="sz" style="width:10px;height:10px"></span><span class="sz" style="width:18px;height:18px"></span>size = number of verses</div>
      <div class="row" style="color:var(--mute)">dotted line = its opposite</div>
    </div>
    <div class="hint">click a star for every verse · drag to move · scroll to zoom</div>
    <aside id="panel" aria-live="polite">
      <div class="ph" id="ph"></div>
      <div class="verses" id="verses"></div>
    </aside>
    <div id="table"></div>
  </main>
</div>

<script id="data" type="application/json">__DATA__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const nodes = D.nodes, V = D.verses, CATS = D.categories;
const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));
const catKeys = Object.keys(CATS);
const GOLD='#F2C56B', EMBER='#E4553D';
const css = getComputedStyle(document.documentElement);

// ---------- state ----------
let pol='all', cats=new Set(catKeys), query='', selected=null, hovered=null, view='map';
const visible = n => (pol==='all'||n.pol===(pol==='v'?'virtue':'haram')) && cats.has(n.cat) &&
  (!query || (n.ar+' '+n.en+' '+n.root+' '+n.lemmas.join(' ')).toLowerCase().includes(query));

// ---------- chips ----------
const chips=document.getElementById('chips');
catKeys.forEach(k=>{const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed','true');b.textContent=CATS[k].ar;b.title=CATS[k].en;
  b.onclick=()=>{ if(cats.size===catKeys.length){cats=new Set([k]);} else if(cats.has(k)){cats.delete(k); if(!cats.size) cats=new Set(catKeys);} else cats.add(k); syncChips(); kick(); renderTable(); };
  chips.appendChild(b); b.dataset.k=k;});
function syncChips(){[...chips.children].forEach(b=>{const on=cats.has(b.dataset.k); b.setAttribute('aria-pressed',on); b.classList.toggle('off',!on&&cats.size!==catKeys.length);});}
const segs={fAll:'all',fV:'v',fH:'h'};
Object.keys(segs).forEach(id=>document.getElementById(id).onclick=()=>{pol=segs[id];Object.keys(segs).forEach(i=>document.getElementById(i).setAttribute('aria-pressed',i===id));kick();renderTable();});
document.getElementById('q').oninput=e=>{query=e.target.value.trim().toLowerCase();kick();renderTable();};
document.getElementById('vMap').onclick=()=>setView('map');
document.getElementById('vTable').onclick=()=>setView('table');
function setView(v){view=v;document.getElementById('table').classList.toggle('on',v==='table');document.getElementById('vMap').setAttribute('aria-pressed',v==='map');document.getElementById('vTable').setAttribute('aria-pressed',v==='table');}

// ---------- layout ----------
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1;
const r = n => 2.5 + 2.1*Math.sqrt(n.count);
const maxCount=Math.max(...nodes.map(n=>n.count));
function centers(){
  // clusters on a ring, belief in the middle
  const cx=W/2, cy=H/2, R=Math.min(W*0.42,H*0.40);
  const ring=catKeys.filter(k=>k!=='belief');
  const c={belief:[cx,cy]};
  ring.forEach((k,i)=>{const a=-Math.PI/2+i*2*Math.PI/ring.length; c[k]=[cx+R*Math.cos(a),cy+R*Math.sin(a)];});
  return c;
}
let C=null, settled=false;
const sim=d3.forceSimulation(nodes)
  .force('x',d3.forceX(d=>C?C[d.cat][0]:W/2).strength(0.18))
  .force('y',d3.forceY(d=>C?C[d.cat][1]:H/2).strength(0.18))
  .force('collide',d3.forceCollide(d=>r(d)+10).iterations(3))
  .force('charge',d3.forceManyBody().strength(-30).distanceMax(220))
  .alphaDecay(0.03).on('tick',draw);
function resize(){
  const rect=canvas.getBoundingClientRect(); dpr=window.devicePixelRatio||1;
  W=rect.width;H=rect.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  C=centers(); sim.force('x').x(d=>C[d.cat][0]); sim.force('y').y(d=>C[d.cat][1]); if(!settled){settled=true; nodes.forEach(n=>{n.x=C[n.cat][0]+(Math.random()-.5)*120;n.y=C[n.cat][1]+(Math.random()-.5)*120;}); sim.alpha(1); for(let i=0;i<300;i++) sim.tick(); draw();} else kick();
}
function kick(){sim.alpha(0.5).restart();}
window.addEventListener('resize',resize);
// initial positions


// zoom/pan
let T=d3.zoomIdentity;
const zoom=d3.zoom().scaleExtent([0.5,4]).on('zoom',e=>{T=e.transform;draw();});
d3.select(canvas).call(zoom).on('dblclick.zoom',null);

// stars background
const stars=[]; for(let i=0;i<260;i++) stars.push([Math.random(),Math.random(),Math.random()*1.3+.2,Math.random()]);

// ---------- draw ----------
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=css.getPropertyValue('--sky');ctx.fillRect(0,0,W,H);
  ctx.save();
  stars.forEach(s=>{ctx.globalAlpha=.25+.35*s[3];ctx.fillStyle='#cfd6ff';ctx.beginPath();ctx.arc(s[0]*W,s[1]*H,s[2],0,7);ctx.fill();});
  ctx.restore();
  ctx.save(); ctx.translate(T.x,T.y); ctx.scale(T.k,T.k);
  // cluster labels + constellation lines to hub
  ctx.font='600 11px "Spectral", serif';
  catKeys.forEach(k=>{
    const [x,y]=C[k];
    const members=nodes.filter(n=>n.cat===k&&visible(n));
    ctx.strokeStyle='rgba(120,135,200,.16)'; ctx.lineWidth=1/T.k;
    members.forEach(n=>{ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(n.x,n.y);ctx.stroke();});
    ctx.fillStyle='rgba(169,176,200,.9)';ctx.textAlign='center';
    ctx.font='700 20px "Amiri", serif'; ctx.fillText(CATS[k].ar,x,y-8);
    ctx.font='400 10.5px "Spectral", serif'; ctx.letterSpacing='1.5px'; ctx.fillText(CATS[k].en.toUpperCase(),x,y+10); ctx.letterSpacing='0px';
  });
  // opposite links
  ctx.setLineDash([2/T.k,4/T.k]); ctx.strokeStyle='rgba(237,230,214,.28)'; ctx.lineWidth=1/T.k;
  nodes.forEach(n=>{ if(!n.opposite||!byId[n.opposite]) return; const o=byId[n.opposite]; if(n.id>o.id) return; if(!visible(n)||!visible(o)) return;
    ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(o.x,o.y);ctx.stroke();});
  ctx.setLineDash([]);
  // nodes
  const sorted=[...nodes].sort((a,b)=>b.count-a.count);
  sorted.forEach(n=>{
    const vis=visible(n); const rr=r(n); const col=n.pol==='virtue'?GOLD:EMBER;
    const active = (selected&&selected.id===n.id)||(hovered&&hovered.id===n.id);
    ctx.globalAlpha=vis?1:0.12;
    const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,rr*1.7);
    g.addColorStop(0,col); g.addColorStop(0.5,col+'66'); g.addColorStop(1,col+'00');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(n.x,n.y,rr*1.7,0,7); ctx.fill();
    ctx.fillStyle=n.pol==='virtue'?'#FFF4D6':'#FFD9CF'; ctx.beginPath(); ctx.arc(n.x,n.y,rr*0.55,0,7); ctx.fill();
    if(active){ctx.strokeStyle='#fff';ctx.lineWidth=1.5/T.k;ctx.beginPath();ctx.arc(n.x,n.y,rr+5,0,7);ctx.stroke();}
    // label
    const showLabel = vis && (T.k*rr>11 || active || T.k>1.8 || query);
    if(showLabel){
      ctx.fillStyle=n.pol==='virtue'?'#FFE7B0':'#FF9C8A';
      ctx.font=(active?'700 ':'400 ')+Math.max(12,Math.min(19,8+rr*0.45))+'px "Amiri", serif';
      ctx.textAlign='center'; ctx.textBaseline='top';
      const short=n.ar.split(' (')[0];
      ctx.fillText(short,n.x,n.y+rr+3);
    }
  });
  ctx.globalAlpha=1; ctx.restore();
}

// ---------- interaction ----------
function pick(px,py){
  const x=(px-T.x)/T.k, y=(py-T.y)/T.k; let best=null,bd=1e9;
  nodes.forEach(n=>{ if(!visible(n)) return; const d=Math.hypot(n.x-x,n.y-y); if(d<r(n)+6/T.k && d<bd){bd=d;best=n;} });
  return best;
}
const tip=document.getElementById('tip');
let dragging=null;
canvas.addEventListener('pointermove',e=>{
  const rect=canvas.getBoundingClientRect(); const px=e.clientX-rect.left, py=e.clientY-rect.top;
  if(dragging){ dragging.fx=(px-T.x)/T.k; dragging.fy=(py-T.y)/T.k; sim.alpha(0.3).restart(); return; }
  const n=pick(px,py); if(n!==hovered){hovered=n;draw();}
  if(n){tip.style.display='block';tip.style.left=px+'px';tip.style.top=py+'px';tip.className='tip'+(n.pol==='haram'?' h':'');
    tip.innerHTML=`<span class="ar">${n.ar}</span>${n.en} <span class="n">· ${n.count} verses</span>`;canvas.style.cursor='pointer';}
  else{tip.style.display='none';canvas.style.cursor='grab';}
});
canvas.addEventListener('pointerdown',e=>{const rect=canvas.getBoundingClientRect();const n=pick(e.clientX-rect.left,e.clientY-rect.top);if(n){dragging=n;n._t=Date.now();n.fx=n.x;n.fy=n.y;canvas.setPointerCapture(e.pointerId);e.stopImmediatePropagation();}},true);
canvas.addEventListener('pointerup',e=>{if(dragging){const n=dragging;dragging=null;n.fx=null;n.fy=null;if(Date.now()-n._t<250)select(n);}});
canvas.addEventListener('pointerleave',()=>{hovered=null;tip.style.display='none';draw();});

// ---------- panel ----------
const panel=document.getElementById('panel'), ph=document.getElementById('ph'), vs=document.getElementById('verses');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function select(n){
  selected=n; panel.classList.add('open'); panel.className='open '+(n.pol==='haram'?'h':'');
  ph.className='ph'+(n.pol==='haram'?' h':'');
  const opp=n.opposite&&byId[n.opposite];
  ph.innerHTML=`<button class="close" aria-label="Close">×</button>
    <div class="ar">${n.ar}</div><div class="en">${n.en}</div>
    <div class="meta"><span>root <b>${n.root}</b></span><span>verses <b>${n.count}</b></span><span>occurrences <b>${n.tokens}</b></span><span>${n.pol==='virtue'?'commanded / praised':'forbidden / condemned'}</span></div>
    ${n.lemmas.length?`<div class="lem">${n.lemmas.map(l=>'<span>'+l+'</span>').join('')}</div>`:''}
    ${n.note?`<div class="note">${n.note}</div>`:''}
    ${opp?`<div class="opp">opposite: <button class="${opp.pol==='haram'?'h':''}" data-id="${opp.id}">${opp.ar}</button></div>`:''}`;
  ph.querySelector('.close').onclick=()=>{panel.classList.remove('open');selected=null;draw();};
  const ob=ph.querySelector('.opp button'); if(ob) ob.onclick=()=>select(byId[ob.dataset.id]);
  const words=n.lemmas.filter(l=>l.length>=3);
  vs.innerHTML=n.verses.map(g=>{const v=V[g]; const ref=v.s+':'+v.a; const key=ref===n.key;
    return `<div class="v${key?' key':''}"><div class="ref"><span>${ref} · ${v.sname}</span>${key?'<span class="k">key verse</span>':''}</div><div class="ar">${v.ar}</div><div class="en">${esc(v.en)}</div></div>`;}).join('');
  vs.scrollTop=0; const k=vs.querySelector('.key'); if(k) k.scrollIntoView({block:'start'});
  draw();
}

// ---------- table ----------
let sortKey='count', sortDir=-1;
function renderTable(){
  const el=document.getElementById('table');
  const rows=nodes.filter(visible).sort((a,b)=>{const va=a[sortKey],vb=b[sortKey];return (va>vb?1:va<vb?-1:0)*sortDir;});
  const th=(k,l)=>`<th data-k="${k}" class="${sortKey===k?'on':''}">${l}${sortKey===k?(sortDir<0?' ↓':' ↑'):''}</th>`;
  el.innerHTML=`<p class="about"><b>${rows.length} concepts</b> · counted by Arabic lemma over the Uthmani text (Quranic Arabic Corpus morphology), Saheeh International alongside. <b>Verses</b> = distinct verses containing the word; <b>occurrences</b> = every time it appears. Where a word is ambiguous the count is left as is and the note says so — click a row to read every verse yourself.</p>
  <div style="overflow-x:auto"><table><thead><tr>${th('ar','Arabic')}${th('en','Meaning')}${th('root','Root')}${th('cat','Cluster')}${th('count','Verses')}${th('tokens','Occurrences')}</tr></thead><tbody>
  ${rows.map(n=>`<tr data-id="${n.id}"><td class="ar">${n.ar}</td><td><span class="pol" style="background:${n.pol==='virtue'?GOLD:EMBER}"></span>${n.en}${n.note?'<div style="color:var(--mute);font-size:12px;font-style:italic">'+n.note+'</div>':''}</td><td style="font-family:var(--ff-ar);font-size:17px;direction:rtl">${n.root}</td><td style="font-family:var(--ff-ar);font-size:16px;direction:rtl">${CATS[n.cat].ar}</td><td class="n">${n.count}<div class="bar" style="width:${Math.max(4,100*n.count/maxCount)}%;background:${n.pol==='virtue'?GOLD:EMBER}"></div></td><td class="n">${n.tokens}</td></tr>`).join('')}
  </tbody></table></div>`;
  el.querySelectorAll('th').forEach(t=>t.onclick=()=>{const k=t.dataset.k; if(sortKey===k) sortDir*=-1; else {sortKey=k;sortDir=(k==='count'||k==='tokens')?-1:1;} renderTable();});
  el.querySelectorAll('tbody tr').forEach(t=>t.onclick=()=>{setView('map');select(byId[t.dataset.id]);});
}
renderTable();
resize();
})();
</script>
