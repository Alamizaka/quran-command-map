<title>خريطة الأمر والنهي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Spectral:ital,wght@0,300;0,400;0,600;1,300&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --sky:#0A0E1C; --sky2:#111830; --line:#232C4A; --line2:#33407A;
    --ink:#EDE6D6; --ink2:#A9B0C8; --mute:#6B7391;
    --gold:#F2C56B; --gold2:#FFE7B0; --ember:#E4553D; --ember2:#FF9C8A;
    --panel:#0F1528; --ff-ar:"Amiri","Scheherazade New","Noto Naskh Arabic",serif;
    --ff-body:"Spectral",Georgia,serif; --ff-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  html,body{height:100%}
  body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--ff-body);font-size:15px;line-height:1.5;overflow:hidden}
  *{box-sizing:border-box}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  #app{display:grid;grid-template-rows:auto 1fr;height:100%}
  header{display:flex;align-items:center;gap:18px;padding:12px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0E1428,var(--sky));flex-wrap:wrap}
  .title{display:flex;flex-direction:column;line-height:1.1}
  .title .ar{font-family:var(--ff-ar);font-size:26px;font-weight:700;color:var(--gold2);direction:rtl}
  .title .en{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-top:4px}
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-inline-start:auto}
  .seg{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
  .seg button{padding:6px 14px;font-size:13px;color:var(--ink2)}
  .seg button[aria-pressed="true"]{background:var(--sky2);color:var(--ink)}
  .seg button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:1px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--ink2);font-family:var(--ff-ar);font-size:15px;line-height:1.2}
  .chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold2)}
  .chip.off{opacity:.45}
  input[type=search]{background:var(--sky2);border:1px solid var(--line2);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;width:180px}
  input[type=search]::placeholder{color:var(--mute)}
  main{position:relative;overflow:hidden}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas.dragging{cursor:grabbing}
  .legend{position:absolute;left:16px;bottom:14px;font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .legend .row{display:flex;align-items:center;gap:8px}
  .legend .st{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor}
  .legend .sizes{display:flex;align-items:center;gap:6px}
  .legend .sz{border-radius:50%;background:var(--ink2);opacity:.7}
  .hint{position:absolute;right:16px;bottom:14px;font-size:12px;color:var(--mute);pointer-events:none;text-align:right}
  .tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line2);padding:8px 12px;border-radius:6px;font-size:13px;transform:translate(-50%,-130%);white-space:nowrap;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .tip .ar{font-family:var(--ff-ar);font-size:19px;direction:rtl;display:block;color:var(--gold2)}
  .tip.h .ar{color:var(--ember2)}
  .tip .n{color:var(--ink2);font-family:var(--ff-mono);font-size:11px}
  /* panel */
  aside{position:absolute;top:0;right:0;height:100%;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .28s ease;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
  aside.open{transform:none}
  @media (prefers-reduced-motion:reduce){aside{transition:none}}
  .ph{padding:18px 22px 14px;border-bottom:1px solid var(--line);position:relative}
  .ph .close{position:absolute;top:12px;left:14px;font-size:22px;color:var(--ink2);line-height:1;padding:4px 8px}
  .ph .ar{font-family:var(--ff-ar);font-size:34px;line-height:1.15;direction:rtl;text-align:right;color:var(--gold2);text-wrap:balance}
  .ph.h .ar{color:var(--ember2)}
  .ph .en{color:var(--ink2);font-size:14px;text-align:right;margin-top:2px}
  .ph .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-family:var(--ff-mono);font-size:11.5px;color:var(--ink2);justify-content:flex-end}
  .ph .meta b{color:var(--ink);font-weight:500}
  .ph .lem{direction:rtl;text-align:right;font-family:var(--ff-ar);font-size:16px;color:var(--mute);margin-top:6px}
  .ph .lem span{margin-inline-start:8px}
  .ph .note{margin-top:8px;font-size:13px;color:var(--ink2);font-style:italic;line-height:1.4}
  .ph .opp{margin-top:8px;font-size:13px;color:var(--ink2)}
  .ph .opp button{font-family:var(--ff-ar);font-size:17px;color:var(--gold2);text-decoration:underline dotted;text-underline-offset:3px}
  .ph .opp button.h{color:var(--ember2)}
  .verses{overflow:auto;padding:6px 22px 30px;flex:1;min-height:0}
  .v{padding:16px 0;border-bottom:1px solid var(--line)}
  .v.key{background:linear-gradient(90deg,transparent,rgba(242,197,107,.06));margin:0 -22px;padding-inline:22px;border-inline-start:2px solid var(--gold)}
  .v .ref{font-family:var(--ff-mono);font-size:11px;color:var(--mute);display:flex;justify-content:space-between}
  .v .ref .k{color:var(--gold)}
  .v .ar{font-family:var(--ff-ar);font-size:22px;line-height:1.85;direction:rtl;text-align:right;margin:6px 0 4px}
  .v .en{font-size:14px;color:var(--ink2);line-height:1.55}
  .v mark{background:none;color:var(--gold2);font-weight:700}
  .h .v mark{color:var(--ember2)}
  .v .tafbtn{margin-top:8px;font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .v .tafbtn:hover{color:var(--ink);border-color:var(--line2)}
  .v .taf{margin-top:10px;padding:12px 14px;border-inline-start:2px solid var(--line2);background:rgba(255,255,255,.025);font-size:14px;line-height:1.65;color:var(--ink2)}
  .v .taf.ar{direction:rtl;text-align:right;font-family:var(--ff-ar);font-size:19px;line-height:1.9}
  .v .taf p{margin:0 0 .7em}
  .v .taf h1,.v .taf h2,.v .taf h3{font-size:1em;color:var(--ink);margin:.6em 0 .3em}
  .v .taf a{color:var(--gold2)}
  .v .taf .src{font-family:var(--ff-mono);font-size:10.5px;color:var(--mute);margin-top:6px;direction:ltr;text-align:left}
  .tafsel{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--mute);justify-content:flex-end}
  .tafsel select{background:var(--sky2);color:var(--ink);border:1px solid var(--line2);border-radius:6px;padding:4px 8px;font:inherit;font-size:12px}
  /* seerah */
  #seerah{padding:14px 22px;border-bottom:1px solid var(--line);flex-shrink:0}
  #seerah .lbl-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px;text-align:right}
  #seerah .lbl{font-family:var(--ff-ar);font-size:16px;color:var(--gold2);direction:rtl;text-align:right}
  .h #seerah .lbl{color:var(--ember2)}
  #seerah .lbl .en{font-family:var(--ff-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);display:block;margin-top:2px}
  #seerah .chev{color:var(--mute);font-size:11px;transition:transform .2s ease;flex-shrink:0}
  #seerah .lbl-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
  #seerah .lbl-toggle:hover .chev{color:var(--ink)}
  .seerah-body{max-height:0;overflow:hidden}
  .seerah-body.open{max-height:30vh;overflow:auto;margin-top:10px;padding-inline-end:2px}
  @media (max-width:720px){.seerah-body.open{max-height:22vh}}
  .story{margin-top:12px;padding:10px 12px;border-inline-start:2px solid var(--line2);background:rgba(255,255,255,.02)}
  .story .st-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .story .st-title{font-size:13px;color:var(--ink);font-weight:600}
  .story .st-pg{font-family:var(--ff-mono);font-size:10.5px;color:var(--mute);white-space:nowrap}
  .story .st-how{font-size:13.5px;color:var(--ink2);line-height:1.55;margin-top:4px}
  .story .strn{display:inline-flex;gap:2px;margin-inline-end:6px;vertical-align:1px}
  .story .strn i{width:5px;height:5px;border-radius:50%;background:var(--line2);display:inline-block}
  .story .strn i.on{background:var(--gold)}
  .h .story .strn i.on{background:var(--ember)}
  .story .storybtn{margin-top:8px;font-size:11.5px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
  .story .storybtn:hover{color:var(--ink);border-color:var(--line2)}
  .story .full{margin-top:9px;padding:10px 12px;background:rgba(255,255,255,.025);font-size:13px;line-height:1.65;color:var(--ink2);white-space:pre-wrap;max-height:340px;overflow:auto}
  #seerah .more{margin-top:10px;font-size:12px;color:var(--mute);border:1px dashed var(--line2);border-radius:999px;padding:4px 12px;display:block}
  #seerah .more:hover{color:var(--ink)}
  #seerah .empty{font-size:13px;color:var(--mute);font-style:italic;margin-top:10px}
  #seerah .src{font-family:var(--ff-mono);font-size:10px;color:var(--mute);margin-top:12px;line-height:1.6}
  /* table view */
  #table{position:absolute;inset:0;background:var(--sky);overflow:auto;display:none;padding:20px 24px}
  #table.on{display:block}
  table{border-collapse:collapse;width:100%;max-width:1100px;margin:0 auto;font-size:14px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:600;position:sticky;top:0;background:var(--sky);cursor:pointer}
  th.on{color:var(--gold2)}
  td.ar{font-family:var(--ff-ar);font-size:20px;direction:rtl;text-align:right;white-space:nowrap}
  td.n{font-family:var(--ff-mono);font-variant-numeric:tabular-nums;text-align:right}
  td .bar{height:6px;border-radius:3px;margin-top:6px;opacity:.85}
  tr{cursor:pointer}
  tr:hover td{background:var(--sky2)}
  .pol{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:1px}
  .about{max-width:1100px;margin:0 auto 18px;color:var(--ink2);font-size:14px;line-height:1.55}
  .about b{color:var(--ink)}
  @media (max-width:720px){
    header{gap:10px;padding:10px 12px}
    .title .ar{font-size:22px}
    input[type=search]{width:130px}
    .legend,.hint{display:none}
    aside{width:100%;height:92vh;top:auto;bottom:0;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(102%)}
    aside::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:99px;background:var(--line2)}
    .ph{padding:20px 16px 10px}
    .ph .close{top:10px;left:8px;font-size:20px}
    .ph .ar{font-size:24px}
    .ph .en{font-size:12px}
    .ph .meta{gap:8px 12px;margin-top:8px;font-size:10.5px}
    .ph .lem{font-size:14px}
    .ph .note{font-size:12px}
    .tafsel{margin-top:8px}
    .tafsel select{font-size:11px;padding:3px 6px}
    #seerah{padding:10px 16px}
    #seerah .lbl{font-size:14px}
    .story{padding:8px 10px}
    .story .st-how{font-size:13px}
    .verses{padding:4px 16px 24px}
    .v{padding:12px 0}
    .v .ar{font-size:19px;line-height:1.7}
    .v .en{font-size:13.5px}
  }

  /* ---------- daily practice ---------- */
  [hidden]{display:none!important}
  .daily-btn{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;border:1px solid var(--gold);border-radius:999px;color:var(--gold2);font-size:13px;background:linear-gradient(90deg,rgba(242,197,107,.12),transparent)}
  .daily-btn .ar{font-family:var(--ff-ar);font-size:16px;line-height:1}
  .daily-btn .pulse{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(242,197,107,.6);animation:pulse 2s infinite}
  .daily-btn.done .pulse{animation:none;background:var(--mute)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,197,107,.55)}70%{box-shadow:0 0 0 9px rgba(242,197,107,0)}100%{box-shadow:0 0 0 0 rgba(242,197,107,0)}}
  .dp-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);max-width:calc(100% - 32px);animation:toastIn .5s ease both}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
  .dp-toast .t-k{font-family:var(--ff-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
  .dp-toast .t-w{font-family:var(--ff-ar);font-size:24px;color:var(--gold2);line-height:1.2}
  .dp-toast.h .t-w{color:var(--ember2)}
  .dp-toast .t-e{font-size:13px;color:var(--ink2)}
  .dp-toast .go{background:var(--gold);color:#1a1405;border-radius:999px;padding:8px 16px;font-weight:600;font-size:13px;white-space:nowrap}
  .dp-toast .x{color:var(--mute);font-size:18px;padding:4px}
  .dp{position:fixed;inset:0;z-index:50;background:#05070F;color:var(--ink);overflow:hidden;display:flex;flex-direction:column}
  .dp .sky{position:absolute;inset:-20%;pointer-events:none;background-image:radial-gradient(1px 1px at 10% 20%,#fff8,transparent),radial-gradient(1px 1px at 30% 70%,#fff6,transparent),radial-gradient(1.5px 1.5px at 55% 35%,#fff9,transparent),radial-gradient(1px 1px at 75% 80%,#fff5,transparent),radial-gradient(1px 1px at 88% 15%,#fff7,transparent),radial-gradient(1px 1px at 20% 90%,#fff5,transparent),radial-gradient(1.5px 1.5px at 65% 60%,#fff6,transparent),radial-gradient(1px 1px at 42% 8%,#fff6,transparent);background-size:340px 340px;animation:drift 90s linear infinite;opacity:.8}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-340px,-170px)}}
  .dp .glow{position:absolute;left:50%;top:42%;width:900px;height:900px;max-width:180vw;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(242,197,107,.16),transparent 60%);pointer-events:none;transition:background .8s}
  .dp.h .glow{background:radial-gradient(circle,rgba(228,85,61,.17),transparent 60%)}
  .dp-top{position:relative;z-index:2;padding:14px 18px 0}
  .dp-bars{display:flex;gap:5px}
  .dp-bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
  .dp-bars i.on::after{content:"";position:absolute;inset:0;background:var(--gold2)}
  .dp.h .dp-bars i.on::after{background:var(--ember2)}
  .dp-meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-family:var(--ff-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
  .dp-meta button{color:var(--ink2);font:inherit;letter-spacing:inherit;padding:4px 6px}
  .dp-meta button:hover{color:var(--ink)}
  .dp-meta .dp-close{font-size:22px;letter-spacing:0;line-height:1}
  .dp-stage{position:relative;z-index:2;flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px 22px}
  .dp-scene{width:100%;max-width:680px;margin:auto;animation:sceneIn .7s cubic-bezier(.2,.7,.2,1) both}
  @keyframes sceneIn{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
  .dp-scene .kick{font-family:var(--ff-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);text-align:center}
  .dp-scene .word{font-family:var(--ff-ar);font-weight:700;font-size:clamp(56px,13vw,120px);line-height:1.25;text-align:center;color:var(--gold2);margin:18px 0 6px;text-shadow:0 0 40px rgba(242,197,107,.35);animation:wordIn 1.6s cubic-bezier(.2,.7,.2,1) both}
  .dp.h .dp-scene .word{color:var(--ember2);text-shadow:0 0 40px rgba(228,85,61,.35)}
  @keyframes wordIn{from{opacity:0;letter-spacing:.15em;filter:blur(14px)}to{opacity:1;letter-spacing:0;filter:none}}
  .dp-scene .gloss{text-align:center;font-size:clamp(18px,3.4vw,24px);color:var(--ink);font-style:italic;animation:sceneIn .8s .6s both}
  .dp-scene .verdict{display:flex;justify-content:center;margin-top:18px;animation:sceneIn .8s .9s both}
  .dp-scene .verdict span{border:1px solid var(--gold);color:var(--gold2);border-radius:999px;padding:5px 14px;font-size:13px}
  .dp.h .dp-scene .verdict span{border-color:var(--ember);color:var(--ember2)}
  .dp-scene .facts{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin-top:22px;font-family:var(--ff-mono);font-size:12px;color:var(--ink2);animation:sceneIn .8s 1.1s both}
  .dp-scene .facts b{color:var(--ink);font-weight:500;font-size:15px;display:block;text-align:center}
  .dp-scene .note{margin:22px auto 0;max-width:520px;text-align:center;font-size:13.5px;font-style:italic;color:var(--ink2);animation:sceneIn .8s 1.3s both}
  .dp-scene .ayah{font-family:var(--ff-ar);font-size:clamp(24px,4.6vw,36px);line-height:1.9;direction:rtl;text-align:center;margin:22px 0 18px}
  .dp-scene .tr{font-size:clamp(16px,2.6vw,19px);line-height:1.6;text-align:center;color:var(--ink);animation:sceneIn .8s .5s both}
  .dp-scene .ref{text-align:center;font-family:var(--ff-mono);font-size:12px;color:var(--mute);margin-top:16px}
  .dp-scene h2{font-family:var(--ff-body);font-weight:600;font-size:clamp(22px,4vw,30px);line-height:1.25;text-align:center;margin:14px 0 6px;color:var(--ink)}
  .dp-scene .pg{text-align:center;font-family:var(--ff-mono);font-size:11px;color:var(--mute)}
  .dp-scene .story-body{font-size:clamp(16px,2.5vw,18.5px);line-height:1.7;color:var(--ink);margin-top:22px;animation:sceneIn .8s .4s both}
  .dp-scene .story-body::first-letter{font-size:2.4em;float:left;line-height:.9;margin:6px 8px 0 0;color:var(--gold2);font-weight:600}
  .dp.h .dp-scene .story-body::first-letter{color:var(--ember2)}
  .dp-scene .full-btn{display:block;margin:22px auto 0;border:1px solid var(--line2);border-radius:999px;padding:6px 16px;font-size:13px;color:var(--ink2)}
  .dp-scene .full-btn:hover{color:var(--ink);border-color:var(--ink2)}
  .dp-scene .full{margin-top:16px;padding:16px 18px;background:rgba(255,255,255,.035);border-inline-start:2px solid var(--line2);font-size:14px;line-height:1.7;color:var(--ink2);white-space:pre-wrap;max-height:42vh;overflow:auto}
  .dp-scene .prompt{font-size:clamp(20px,3.6vw,26px);line-height:1.5;text-align:center;color:var(--ink);font-style:italic;margin:20px auto 0;max-width:560px}
  .dp-scene .actions{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:30px}
  .dp-scene .complete{background:var(--gold);color:#1a1405;border-radius:999px;padding:12px 26px;font-weight:600;font-size:15px}
  .dp.h .dp-scene .complete{background:var(--ember);color:#fff}
  .dp-scene .complete[disabled]{background:none;border:1px solid var(--line2);color:var(--ink2);cursor:default}
  .dp-scene .link{font-size:13px;color:var(--ink2);text-decoration:underline dotted;text-underline-offset:3px}
  .dp-nav{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:12px 18px 18px}
  .dp-nav button{border:1px solid var(--line2);border-radius:999px;padding:9px 18px;font-size:14px;color:var(--ink)}
  .dp-nav button[disabled]{opacity:.3;cursor:default}
  .dp-nav .next{background:rgba(255,255,255,.06)}
  .dp-nav .hint2{font-family:var(--ff-mono);font-size:10.5px;color:var(--mute);letter-spacing:.1em}
  .dp-path{width:100%;max-width:760px;margin:auto;animation:sceneIn .6s both}

<script id="data" type="application/json">__DATA__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const nodes = D.nodes, V = D.verses, CATS = D.categories;
const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));
const catKeys = Object.keys(CATS);
const GOLD='#F2C56B', EMBER='#E4553D';
const css = getComputedStyle(document.documentElement);

// ---------- state ----------
let pol='all', cats=new Set(catKeys), query='', selected=null, hovered=null, view='map';
const visible = n => (pol==='all'||n.pol===(pol==='v'?'virtue':'haram')) && cats.has(n.cat) &&
  (!query || (n.ar+' '+n.en+' '+n.root+' '+n.lemmas.join(' ')).toLowerCase().includes(query));

// ---------- chips ----------
const chips=document.getElementById('chips');
catKeys.forEach(k=>{const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed','true');b.textContent=CATS[k].ar;b.title=CATS[k].en;
  b.onclick=()=>{ if(cats.size===catKeys.length){cats=new Set([k]);} else if(cats.has(k)){cats.delete(k); if(!cats.size) cats=new Set(catKeys);} else cats.add(k); syncChips(); kick(); renderTable(); };
  chips.appendChild(b); b.dataset.k=k;});
function syncChips(){[...chips.children].forEach(b=>{const on=cats.has(b.dataset.k); b.setAttribute('aria-pressed',on); b.classList.toggle('off',!on&&cats.size!==catKeys.length);});}
const segs={fAll:'all',fV:'v',fH:'h'};
Object.keys(segs).forEach(id=>document.getElementById(id).onclick=()=>{pol=segs[id];Object.keys(segs).forEach(i=>document.getElementById(i).setAttribute('aria-pressed',i===id));kick();renderTable();});
document.getElementById('q').oninput=e=>{query=e.target.value.trim().toLowerCase();kick();renderTable();};
document.getElementById('vMap').onclick=()=>setView('map');
document.getElementById('vTable').onclick=()=>setView('table');
function setView(v){view=v;document.getElementById('table').classList.toggle('on',v==='table');document.getElementById('vMap').setAttribute('aria-pressed',v==='map');document.getElementById('vTable').setAttribute('aria-pressed',v==='table');}

// ---------- layout ----------
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1;
const r = n => 2.5 + 2.1*Math.sqrt(n.count);
const maxCount=Math.max(...nodes.map(n=>n.count));
function centers(){
  // clusters on a ring, belief in the middle
  const cx=W/2, cy=H/2, R=Math.min(W*0.42,H*0.40);
  const ring=catKeys.filter(k=>k!=='belief');
  const c={belief:[cx,cy]};
  ring.forEach((k,i)=>{const a=-Math.PI/2+i*2*Math.PI/ring.length; c[k]=[cx+R*Math.cos(a),cy+R*Math.sin(a)];});
  return c;
}
let C=null, settled=false;
const sim=d3.forceSimulation(nodes)
  .force('x',d3.forceX(d=>C?C[d.cat][0]:W/2).strength(0.18))
  .force('y',d3.forceY(d=>C?C[d.cat][1]:H/2).strength(0.18))
  .force('collide',d3.forceCollide(d=>r(d)+10).iterations(3))
  .force('charge',d3.forceManyBody().strength(-30).distanceMax(220))
  .alphaDecay(0.03).on('tick',draw);
function resize(){
  const rect=canvas.getBoundingClientRect(); dpr=window.devicePixelRatio||1;
  W=rect.width;H=rect.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  C=centers(); sim.force('x').x(d=>C[d.cat][0]); sim.force('y').y(d=>C[d.cat][1]); if(!settled){settled=true; nodes.forEach(n=>{n.x=C[n.cat][0]+(Math.random()-.5)*120;n.y=C[n.cat][1]+(Math.random()-.5)*120;}); sim.alpha(1); for(let i=0;i<300;i++) sim.tick(); draw();} else kick();
}
function kick(){sim.alpha(0.5).restart();}
window.addEventListener('resize',resize);
// initial positions


// zoom/pan
let T=d3.zoomIdentity;
const zoom=d3.zoom().scaleExtent([0.5,4]).on('zoom',e=>{T=e.transform;draw();});
d3.select(canvas).call(zoom).on('dblclick.zoom',null);

// stars background
const stars=[]; for(let i=0;i<260;i++) stars.push([Math.random(),Math.random(),Math.random()*1.3+.2,Math.random()]);

// ---------- draw ----------
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=css.getPropertyValue('--sky');ctx.fillRect(0,0,W,H);
  ctx.save();
  stars.forEach(s=>{ctx.globalAlpha=.25+.35*s[3];ctx.fillStyle='#cfd6ff';ctx.beginPath();ctx.arc(s[0]*W,s[1]*H,s[2],0,7);ctx.fill();});
  ctx.restore();
  ctx.save(); ctx.translate(T.x,T.y); ctx.scale(T.k,T.k);
  // cluster labels + constellation lines to hub
  ctx.font='600 11px "Spectral", serif';
  catKeys.forEach(k=>{
    const [x,y]=C[k];
    const members=nodes.filter(n=>n.cat===k&&visible(n));
    ctx.strokeStyle='rgba(120,135,200,.16)'; ctx.lineWidth=1/T.k;
    members.forEach(n=>{ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(n.x,n.y);ctx.stroke();});
    ctx.fillStyle='rgba(169,176,200,.9)';ctx.textAlign='center';
    ctx.font='700 20px "Amiri", serif'; ctx.fillText(CATS[k].ar,x,y-8);
    ctx.font='400 10.5px "Spectral", serif'; ctx.letterSpacing='1.5px'; ctx.fillText(CATS[k].en.toUpperCase(),x,y+10); ctx.letterSpacing='0px';
  });
  // opposite links
  ctx.setLineDash([2/T.k,4/T.k]); ctx.strokeStyle='rgba(237,230,214,.28)'; ctx.lineWidth=1/T.k;
  nodes.forEach(n=>{ if(!n.opposite||!byId[n.opposite]) return; const o=byId[n.opposite]; if(n.id>o.id) return; if(!visible(n)||!visible(o)) return;
    ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(o.x,o.y);ctx.stroke();});
  ctx.setLineDash([]);
  // nodes
  const sorted=[...nodes].sort((a,b)=>b.count-a.count);
  sorted.forEach(n=>{
    const vis=visible(n); const rr=r(n); const col=n.pol==='virtue'?GOLD:EMBER;
    const active = (selected&&selected.id===n.id)||(hovered&&hovered.id===n.id);
    ctx.globalAlpha=vis?1:0.12;
    const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,rr*1.7);
    g.addColorStop(0,col); g.addColorStop(0.5,col+'66'); g.addColorStop(1,col+'00');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(n.x,n.y,rr*1.7,0,7); ctx.fill();
    ctx.fillStyle=n.pol==='virtue'?'#FFF4D6':'#FFD9CF'; ctx.beginPath(); ctx.arc(n.x,n.y,rr*0.55,0,7); ctx.fill();
    if(active){ctx.strokeStyle='#fff';ctx.lineWidth=1.5/T.k;ctx.beginPath();ctx.arc(n.x,n.y,rr+5,0,7);ctx.stroke();}
    // label
    const showLabel = vis && (T.k*rr>11 || active || T.k>1.8 || query);
    if(showLabel){
      ctx.fillStyle=n.pol==='virtue'?'#FFE7B0':'#FF9C8A';
      ctx.font=(active?'700 ':'400 ')+Math.max(12,Math.min(19,8+rr*0.45))+'px "Amiri", serif';
      ctx.textAlign='center'; ctx.textBaseline='top';
      const short=n.ar.split(' (')[0];
      ctx.fillText(short,n.x,n.y+rr+3);
    }
  });
  ctx.globalAlpha=1; ctx.restore();
}

// ---------- interaction ----------
function pick(px,py){
  const x=(px-T.x)/T.k, y=(py-T.y)/T.k; let best=null,bd=1e9;
  nodes.forEach(n=>{ if(!visible(n)) return; const d=Math.hypot(n.x-x,n.y-y); if(d<r(n)+6/T.k && d<bd){bd=d;best=n;} });
  return best;
}
const tip=document.getElementById('tip');
let dragging=null;
canvas.addEventListener('pointermove',e=>{
  const rect=canvas.getBoundingClientRect(); const px=e.clientX-rect.left, py=e.clientY-rect.top;
  if(dragging){ dragging.fx=(px-T.x)/T.k; dragging.fy=(py-T.y)/T.k; sim.alpha(0.3).restart(); return; }
  const n=pick(px,py); if(n!==hovered){hovered=n;draw();}
  if(n){tip.style.display='block';tip.style.left=px+'px';tip.style.top=py+'px';tip.className='tip'+(n.pol==='haram'?' h':'');
    tip.innerHTML=`<span class="ar">${n.ar}</span>${n.en} <span class="n">· ${n.count} verses</span>`;canvas.style.cursor='pointer';}
  else{tip.style.display='none';canvas.style.cursor='grab';}
});
canvas.addEventListener('pointerdown',e=>{const rect=canvas.getBoundingClientRect();const n=pick(e.clientX-rect.left,e.clientY-rect.top);if(n){dragging=n;n._t=Date.now();n.fx=n.x;n.fy=n.y;canvas.setPointerCapture(e.pointerId);e.stopImmediatePropagation();}},true);
canvas.addEventListener('pointerup',e=>{if(dragging){const n=dragging;dragging=null;n.fx=null;n.fy=null;if(Date.now()-n._t<250)select(n);}});
canvas.addEventListener('pointerleave',()=>{hovered=null;tip.style.display='none';draw();});

// ---------- panel ----------
const panel=document.getElementById('panel'), ph=document.getElementById('ph'), vs=document.getElementById('verses');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function select(n){
  selected=n; panel.classList.add('open'); panel.className='open '+(n.pol==='haram'?'h':'');
  ph.className='ph'+(n.pol==='haram'?' h':'');
  const opp=n.opposite&&byId[n.opposite];
  ph.innerHTML=`<button class="close" aria-label="Close">×</button>
    <div class="ar">${n.ar}</div><div class="en">${n.en}</div>
    <div class="meta"><span>root <b>${n.root}</b></span><span>verses <b>${n.count}</b></span><span>occurrences <b>${n.tokens}</b></span><span>${n.pol==='virtue'?'commanded / praised':'forbidden / condemned'}</span></div>
    ${n.lemmas.length?`<div class="lem">${n.lemmas.map(l=>'<span>'+l+'</span>').join('')}</div>`:''}
    ${n.note?`<div class="note">${n.note}</div>`:''}
    ${opp?`<div class="opp">opposite: <button class="${opp.pol==='haram'?'h':''}" data-id="${opp.id}">${opp.ar}</button></div>`:''}
    <div class="tafsel"><label for="tafsel">tafsir · تفسير</label><select id="tafsel">${tafOptions()}</select></div>`;
  ph.querySelector('#tafsel').onchange=e=>{tafsirId=+e.target.value; try{localStorage.setItem('tafsirId',tafsirId);}catch(_){} vs.querySelectorAll('.taf').forEach(x=>x.remove()); vs.querySelectorAll('.tafbtn').forEach(b=>{b.textContent='tafsir · تفسير';b.dataset.open='';});};
  ph.querySelector('.close').onclick=()=>{panel.classList.remove('open');selected=null;draw();};
  const ob=ph.querySelector('.opp button'); if(ob) ob.onclick=()=>select(byId[ob.dataset.id]);
  renderSeerah(n);
  const words=n.lemmas.filter(l=>l.length>=3);
  vs.innerHTML=n.verses.map(g=>{const v=V[g]; const ref=v.s+':'+v.a; const key=ref===n.key;
    return `<div class="v${key?' key':''}"><div class="ref"><span>${ref} · ${v.sname}</span>${key?'<span class="k">key verse</span>':''}</div><div class="ar">${v.ar}</div><div class="en">${esc(v.en)}</div><button class="tafbtn" data-ref="${ref}">tafsir · تفسير</button></div>`;}).join('');
  vs.querySelectorAll('.tafbtn').forEach(b=>b.onclick=()=>toggleTafsir(b));
  vs.scrollTop=0; const k=vs.querySelector('.key'); if(k) k.scrollIntoView({block:'start'});
  draw();
}

// ---------- seerah: episodes from the Prophet's life illustrating this concept ----------
const SEERAH=(D.seerah&&D.seerah.by_concept)||{};
const storyPacks=new Map();
const SEERAH_STEP=4;
function storyItem(s,i,n){
  const strn=[1,2,3].map(k=>`<i class="${k<=s.strength?'on':''}"></i>`).join('');
  return `<div class="story" data-i="${i}"><div class="st-h"><span class="st-title">${esc(s.title)}</span><span class="st-pg">p.${s.page}</span></div>
    <div class="st-how"><span class="strn">${strn}</span>${esc(s.how)}</div>
    <button class="storybtn" data-section="${s.section}" data-batch="${s.batch}">read full story ↗</button></div>`;
}
function renderSeerah(n){
  const box=document.getElementById('seerah');
  const list=SEERAH[n.id]||[];
  if(!list.length){
    box.innerHTML=`<div class="lbl"><span class="en">from the seerah</span>من السيرة</div><div class="empty">No representative episode tagged for this concept yet.</div>`;
    return;
  }
  box.dataset.shown=Math.min(SEERAH_STEP,list.length);
  const countLbl=`${list.length} episode${list.length>1?'s':''}`;
  box.innerHTML=`<button class="lbl-toggle" aria-expanded="false">
      <span class="lbl"><span class="en">from the seerah — ${countLbl}, tap to show</span>من السيرة</span>
      <span class="chev">▾</span>
    </button>
    <div class="seerah-body"></div>`;
  const toggleBtn=box.querySelector('.lbl-toggle'), body=box.querySelector('.seerah-body');
  const drawBody=()=>{
    const shown=+box.dataset.shown;
    body.innerHTML=list.slice(0,shown).map((s,i)=>storyItem(s,i,n)).join('')
      + (shown<list.length?`<button class="more">show ${Math.min(SEERAH_STEP,list.length-shown)} more</button>`:'')
      + `<div class="src">Seerah of Prophet Muhammad ﷺ, narrated from Ibn Hisham, Ibn Kathir and the hadith collections. Episode summaries paraphrased from a lecture-series transcription of that material.</div>`;
    const mb=body.querySelector('.more'); if(mb) mb.onclick=(e)=>{e.stopPropagation();box.dataset.shown=Math.min(list.length,shown+SEERAH_STEP);drawBody();};
    body.querySelectorAll('.storybtn').forEach(b=>b.onclick=(e)=>{e.stopPropagation();toggleStory(b);});
  };
  drawBody();
  toggleBtn.onclick=()=>{
    const open=body.classList.toggle('open');
    toggleBtn.setAttribute('aria-expanded',open?'true':'false');
    toggleBtn.querySelector('.lbl .en').textContent=open?`from the seerah — ${countLbl}, tap to hide`:`from the seerah — ${countLbl}, tap to show`;
  };
}
async function toggleStory(btn){
  const card=btn.closest('.story'); const open=card.querySelector('.full');
  if(open){open.remove();btn.textContent='read full story ↗';return;}
  const sid=btn.dataset.section, bt=btn.dataset.batch;
  const box=document.createElement('div'); box.className='full'; box.textContent='…'; card.appendChild(box); btn.textContent='hide';
  try{
    let pack=storyPacks.get(bt);
    if(pack===undefined){ const r=await fetch(`seerah/packs/${bt}.json`,{cache:'force-cache'}); pack=r.ok?await r.json():null; storyPacks.set(bt,pack); }
    const text=pack&&pack[sid];
    box.textContent=text?text.trim():'Full text not available for this section.';
  }catch(e){
    box.textContent='Could not load the full story text here — this page can\'t reach outside files in this context.';
  }
}

// ---------- tafsir (quran.com API, loaded on demand) ----------
const TAFSIRS=[{id:169,name:'Ibn Kathir (English, abridged)',ar:false,slug:'en-tafisr-ibn-kathir',bundled:true},{id:16,name:'الميسّر (عربي، مختصر)',ar:true,slug:'ar-tafsir-muyassar',bundled:true},{id:14,name:'ابن كثير (عربي)',ar:true,slug:'ar-tafsir-ibn-kathir'},{id:91,name:'السعدي (عربي)',ar:true,slug:'ar-tafseer-al-saddi'},{id:15,name:'الطبري (عربي)',ar:true,slug:'ar-tafsir-al-tabari'},{id:90,name:'القرطبي (عربي)',ar:true,slug:'ar-tafseer-al-qurtubi'},{id:168,name:"Ma'arif al-Qur'an (English)",ar:false,slug:'en-tafsir-maarif-ul-quran'}];
let apiBlocked=false;
function tafLabel(t){ if(t.bundled) return t.name; return t.name+(apiBlocked?' — needs internet (blocked here)':' — online');}
function tafOptions(){ return TAFSIRS.map(t=>`<option value="${t.id}" ${t.id===tafsirId?'selected':''} ${(!t.bundled&&apiBlocked)?'disabled':''}>${tafLabel(t)}</option>`).join('');}
let tafsirId=169; try{const t=+localStorage.getItem('tafsirId'); if(TAFSIRS.some(x=>x.id===t)) tafsirId=t;}catch(_){}
const tafCache=new Map(); const tafPacks=new Map();
function sanitize(html){const d=document.createElement('div');d.innerHTML=html;d.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(x=>x.remove());d.querySelectorAll('*').forEach(el=>{[...el.attributes].forEach(a=>{if(/^on/i.test(a.name)||a.name==='style'||(a.name==='href'&&/^\s*javascript:/i.test(a.value))) el.removeAttribute(a.name);});});return d.innerHTML;}
async function toggleTafsir(btn){
  const row=btn.closest('.v'); const open=row.querySelector('.taf');
  if(open){open.remove();btn.textContent='tafsir · تفسير';return;}
  const ref=btn.dataset.ref; const T=TAFSIRS.find(t=>t.id===tafsirId); const [s,a]=ref.split(':');
  const box=document.createElement('div'); box.className='taf'+(T.ar?' ar':''); box.textContent='…'; row.appendChild(box); btn.textContent='hide';
  const key=tafsirId+'/'+ref;
  try{
    let html=tafCache.get(key);
    if(html===undefined){
      // 1) bundled pack shipped with the page (tafsir/<id>/<surah>.json), 2) live quran.com API
      const pk=tafsirId+'/'+s; let pack=tafPacks.get(pk);
      if(pack===undefined){ try{const r=await fetch(`tafsir/${tafsirId}/${s}.json`,{cache:'force-cache'}); pack=r.ok?await r.json():null;}catch(_){pack=null;} tafPacks.set(pk,pack); }
      if(pack&&pack[a]!==undefined){ html=pack[a]; }
      else { const r=await fetch(`https://api.quran.com/api/v4/tafsirs/${tafsirId}/by_ayah/${ref}`); if(!r.ok) throw new Error(r.status); const j=await r.json(); html=(j.tafsir&&j.tafsir.text)||''; }
      tafCache.set(key,html);
    }
    box.innerHTML=(html?sanitize(html):'<p>No entry for this verse in this tafsir (it may be covered under a neighbouring verse).</p>')+`<div class="src">${T.name} · <a href="https://quran.com/${s}/${a}/tafsirs/${T.slug}" target="_blank" rel="noopener">quran.com ↗</a></div>`;
  }catch(e){
    apiBlocked=true;
    const sel=document.getElementById('tafsel'); if(sel) sel.innerHTML=tafOptions();
    box.innerHTML=`<p>${T.name} isn't stored in this page, and it can't be fetched here. The two tafsirs at the top of the picker (Ibn Kathir in English, al-Muyassar in Arabic) are built in and always work.</p><div class="src"><a href="https://quran.com/${s}/${a}/tafsirs/${T.slug}" target="_blank" rel="noopener">Open ${T.name} for ${ref} on quran.com ↗</a></div>`;
  }
}

// ---------- table ----------
let sortKey='count', sortDir=-1;
function renderTable(){
  const el=document.getElementById('table');
  const rows=nodes.filter(visible).sort((a,b)=>{const va=a[sortKey],vb=b[sortKey];return (va>vb?1:va<vb?-1:0)*sortDir;});
  const th=(k,l)=>`<th data-k="${k}" class="${sortKey===k?'on':''}">${l}${sortKey===k?(sortDir<0?' ↓':' ↑'):''}</th>`;
  el.innerHTML=`<p class="about"><b>${rows.length} concepts</b> · counted by Arabic lemma over the Uthmani text (Quranic Arabic Corpus morphology), Saheeh International alongside. <b>Verses</b> = distinct verses containing the word; <b>occurrences</b> = every time it appears. Where a word is ambiguous the count is left as is and the note says so — click a row to read every verse yourself.</p>
  <div style="overflow-x:auto"><table><thead><tr>${th('ar','Arabic')}${th('en','Meaning')}${th('root','Root')}${th('cat','Cluster')}${th('count','Verses')}${th('tokens','Occurrences')}</tr></thead><tbody>
  ${rows.map(n=>`<tr data-id="${n.id}"><td class="ar">${n.ar}</td><td><span class="pol" style="background:${n.pol==='virtue'?GOLD:EMBER}"></span>${n.en}${n.note?'<div style="color:var(--mute);font-size:12px;font-style:italic">'+n.note+'</div>':''}</td><td style="font-family:var(--ff-ar);font-size:17px;direction:rtl">${n.root}</td><td style="font-family:var(--ff-ar);font-size:16px;direction:rtl">${CATS[n.cat].ar}</td><td class="n">${n.count}<div class="bar" style="width:${Math.max(4,100*n.count/maxCount)}%;background:${n.pol==='virtue'?GOLD:EMBER}"></div></td><td class="n">${n.tokens}</td></tr>`).join('')}
  </tbody></table></div>`;
  el.querySelectorAll('th').forEach(t=>t.onclick=()=>{const k=t.dataset.k; if(sortKey===k) sortDir*=-1; else {sortKey=k;sortDir=(k==='count'||k==='tokens')?-1:1;} renderTable();});
  el.querySelectorAll('tbody tr').forEach(t=>t.onclick=()=>{setView('map');select(byId[t.dataset.id]);});
}

// ---------- daily practice: one concept a day, cinematic ----------
const DP_KEY='quranmap.daily.v1';
const CAT_ORDER=['belief','worship','character','speech','money','family','food','blood'];
const PATH=(()=>{const out=[],seen=new Set();
  const add=n=>{if(n&&!seen.has(n.id)){seen.add(n.id);out.push(n);}};
  CAT_ORDER.forEach(c=>{
    const inCat=nodes.filter(n=>n.cat===c);
    inCat.filter(n=>n.pol==='virtue').sort((a,b)=>b.count-a.count).forEach(v=>{add(v); if(v.opposite) add(byId[v.opposite]);});
    inCat.filter(n=>n.pol==='haram').sort((a,b)=>b.count-a.count).forEach(add);
  });
  nodes.forEach(add); return out;})();
const refToGid={}; Object.values(V).forEach(v=>{refToGid[v.s+':'+v.a]=v.gid;});
const arNum=x=>String(x).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const dayStr=d=>{const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());};
const today=dayStr(new Date());
let dpState=null;
function dpLoad(){try{const r=JSON.parse(localStorage.getItem(DP_KEY)||'null'); if(r&&r.start&&Array.isArray(r.done)) return r;}catch(_){} return {start:today,done:[],dismissed:''};}
function dpSave(){try{localStorage.setItem(DP_KEY,JSON.stringify(dpState));}catch(_){}}
dpState=dpLoad(); if(!dpState.start){dpState.start=today;} dpSave();
function unlockedMax(){const a=new Date(dpState.start+'T00:00:00'), b=new Date(today+'T00:00:00'); const d=Math.round((b-a)/86400000); return Math.max(0,Math.min(PATH.length-1,d));}
function currentIdx(){const max=unlockedMax(); for(let i=0;i<=max;i++) if(!dpState.done.includes(PATH[i].id)) return i; return max;}
function todayDone(){const i=currentIdx(); return dpState.done.includes(PATH[i].id);}
function storiesFor(n){const seen=new Set(),out=[]; (SEERAH[n.id]||[]).forEach(s=>{const k=s.how.slice(0,80); if(!seen.has(k)&&!seen.has('t'+s.title)){seen.add(k);seen.add('t'+s.title);out.push(s);}}); return out.slice(0,3);}
async function loadStoryText(section,batch){let pack=storyPacks.get(batch); if(pack===undefined){try{const r=await fetch(`seerah/packs/${batch}.json`,{cache:'force-cache'}); pack=r.ok?await r.json():null;}catch(_){pack=null;} storyPacks.set(batch,pack);} return pack&&pack[section];}

const dp=document.getElementById('dp'), dpStage=document.getElementById('dpStage'), dpBars=document.getElementById('dpBars');
let dpIdx=0, dpScene=0, dpScenes=[], dpMode='lesson';
function reflectFor(n){
  return n.pol==='virtue'
    ? `Where, in the next 24 hours, can you practise <b>${esc(n.en.toLowerCase())}</b> once — deliberately, and without being seen?`
    : `Where does <b>${esc(n.en.toLowerCase())}</b> find its way into your day — and what is one concrete thing you will do to shut that door today?`;
}
function buildScenes(n,idx){
  const cat=CATS[n.cat]; const sc=[];
  sc.push(()=>`<div class="dp-scene"><div class="kick">Day ${idx+1} · اليوم ${arNum(idx+1)} — ${cat.ar} · ${esc(cat.en)}</div>
    <div class="word">${n.ar}</div><div class="gloss">${esc(n.en)}</div>
    <div class="verdict"><span>${n.pol==='virtue'?'Commanded / praised · مأمور به':'Forbidden / condemned · منهيّ عنه'}</span></div>
    <div class="facts"><div><b>${n.count}</b>verses</div><div><b>${n.tokens}</b>occurrences</div><div><b style="font-family:var(--ff-ar)">${n.root}</b>root</div></div>
    ${n.note?`<div class="note">${esc(n.note)}</div>`:''}</div>`);
  const gid=n.key&&refToGid[n.key]; const v=gid?V[gid]:(n.verses.length?V[n.verses[0]]:null);
  if(v) sc.push(()=>`<div class="dp-scene"><div class="kick">The verse · الآية</div><div class="ayah">${v.ar}</div><div class="tr">${esc(v.en)}</div><div class="ref">${v.s}:${v.a} · ${esc(v.sname)}</div></div>`);
  const st=storiesFor(n);
  st.forEach((s,i)=>sc.push(()=>`<div class="dp-scene"><div class="kick">From the Seerah · من السيرة — story ${i+1} of ${st.length}</div><h2>${esc(s.title)}</h2><div class="pg">p.${s.page}</div>
    <div class="story-body">${esc(s.how)}</div><button class="full-btn" data-section="${s.section}" data-batch="${s.batch}">Read the full story ↓</button></div>`));
  if(!st.length) sc.push(()=>`<div class="dp-scene"><div class="kick">From the Seerah · من السيرة</div><h2>No episode in the book singles this one out.</h2><div class="story-body" style="text-align:center">The text of the Quran carries it alone today. Read the verses slowly — they are the lesson.</div></div>`);
  sc.push(()=>{const done=dpState.done.includes(n.id); const opp=n.opposite&&byId[n.opposite];
    return `<div class="dp-scene"><div class="kick">Carry it today · خذها معك</div><div class="word" style="font-size:clamp(40px,9vw,72px)">${n.ar}</div>
    <div class="prompt">${reflectFor(n)}</div>
    <div class="actions"><button class="complete" id="dpDone" ${done?'disabled':''}>${done?'✓ Day '+(idx+1)+' complete':'Mark day '+(idx+1)+' complete'}</button>
    <button class="link" id="dpMap">Read all ${n.count} verses in the map</button>
    ${opp?`<button class="link" id="dpOpp">Its opposite: ${opp.ar} · ${esc(opp.en)}</button>`:''}</div></div>`;});
  return sc;
}
function dpRender(){
  if(dpMode==='path'){ renderPath(); return; }
  const n=PATH[dpIdx]; dp.classList.toggle('h',n.pol==='haram');
  dpBars.innerHTML=dpScenes.map((_,i)=>`<i class="${i<=dpScene?'on':''}"></i>`).join('');
  document.getElementById('dpDayLbl').textContent=`Day ${dpIdx+1} / ${PATH.length}`;
  dpStage.innerHTML=dpScenes[dpScene](); dpStage.scrollTop=0;
  document.getElementById('dpPrev').disabled=dpScene===0;
  const last=dpScene===dpScenes.length-1; const nx=document.getElementById('dpNext'); nx.textContent=last?'The path ▦':'Next →'; nx.disabled=false;
  const fb=dpStage.querySelector('.full-btn'); if(fb) fb.onclick=async()=>{const open=dpStage.querySelector('.full'); if(open){open.remove();fb.textContent='Read the full story ↓';return;}
    const box=document.createElement('div'); box.className='full'; box.textContent='…'; fb.after(box); fb.textContent='Hide full story ↑';
    const t=await loadStoryText(fb.dataset.section,fb.dataset.batch); box.textContent=t?t.trim():'The full text could not be loaded here.'; box.scrollIntoView({block:'nearest',behavior:'smooth'});};
  const db=document.getElementById('dpDone'); if(db) db.onclick=()=>{if(!dpState.done.includes(n.id)) dpState.done.push(n.id); dpSave(); syncDailyBtn(); dpScenes=buildScenes(n,dpIdx); dpRender();};
  const mb=document.getElementById('dpMap'); if(mb) mb.onclick=()=>{dpClose(); setView('map'); select(n);};
  const ob=document.getElementById('dpOpp'); if(ob) ob.onclick=()=>{dpClose(); setView('map'); select(byId[n.opposite]);};
}
function renderPath(){
  dp.classList.remove('h'); dpBars.innerHTML=''; const max=unlockedMax(), cur=currentIdx();
  document.getElementById('dpDayLbl').textContent=`${dpState.done.length} / ${PATH.length} complete`;
  dpStage.innerHTML=`<div class="dp-path"><h2>الطريق</h2><div class="sub">One concept a day — ${PATH.length} days from faith to the forbidden. A new day unlocks each morning.</div>
    <div class="stat">started ${dpState.start} · ${dpState.done.length} learned · ${Math.max(0,max+1-dpState.done.length)} waiting</div>
    <div class="dp-grid">${PATH.map((n,i)=>{const cls=[n.pol==='virtue'?'v':'hh']; if(dpState.done.includes(n.id)) cls.push('done'); if(i===cur) cls.push('today'); if(i>max) cls.push('locked');
      return `<button class="${cls.join(' ')}" data-i="${i}" ${i>max?'disabled title="Unlocks on day '+(i+1)+'"':''}><span class="n">${i+1}</span><span class="w">${i>max?'·':n.ar}</span></button>`;}).join('')}</div></div>`;
  dpStage.querySelectorAll('.dp-grid button:not([disabled])').forEach(b=>b.onclick=()=>dpOpen(+b.dataset.i));
  document.getElementById('dpPrev').disabled=true; const nx=document.getElementById('dpNext'); nx.textContent='Today →'; nx.disabled=false;
}
function dpOpen(i){ dpMode='lesson'; dpIdx=(i===undefined?currentIdx():i); dpScene=0; dpScenes=buildScenes(PATH[dpIdx],dpIdx); dp.hidden=false; hideToast(); dpRender(); }
function dpClose(){ dp.hidden=true; }
function dpNext(){ if(dpMode==='path'){dpOpen();return;} if(dpScene<dpScenes.length-1){dpScene++;dpRender();} else {dpMode='path';dpRender();} }
function dpPrev(){ if(dpMode==='lesson'&&dpScene>0){dpScene--;dpRender();} }
document.getElementById('dpNext').onclick=dpNext; document.getElementById('dpPrev').onclick=dpPrev;
document.getElementById('dpClose').onclick=dpClose;
document.getElementById('dpPathBtn').onclick=()=>{dpMode='path';dp.hidden=false;dpRender();};
document.addEventListener('keydown',e=>{ if(dp.hidden) return; if(e.key==='Escape') dpClose(); else if(e.key==='ArrowRight') dpNext(); else if(e.key==='ArrowLeft') dpPrev(); });
let tx=null; dpStage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
dpStage.addEventListener('touchend',e=>{if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>60){dx<0?dpNext():dpPrev();}},{passive:true});
function syncDailyBtn(){const b=document.getElementById('dailyBtn'); b.classList.toggle('done',todayDone()); document.getElementById('dailyDay').textContent=' · Day '+(currentIdx()+1);}
document.getElementById('dailyBtn').onclick=()=>dpOpen();
syncDailyBtn();
const toast=document.getElementById('dpToast');
function hideToast(){toast.hidden=true;}
function showToast(){ const i=currentIdx(), n=PATH[i]; toast.className='dp-toast'+(n.pol==='haram'?' h':'');
  toast.innerHTML=`<div><div class="t-k">Today · Day ${i+1} of ${PATH.length}</div><div class="t-w">${n.ar}</div><div class="t-e">${esc(n.en)}</div></div><button class="go">Begin →</button><button class="x" aria-label="Later">×</button>`;
  toast.hidden=false; toast.querySelector('.go').onclick=()=>dpOpen(); toast.querySelector('.x').onclick=()=>{dpState.dismissed=today;dpSave();hideToast();}; }
if(!todayDone() && dpState.dismissed!==today) setTimeout(showToast,1400);

renderTable();
resize();
})();
</script>
